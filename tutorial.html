                setTimeout(async () => {
                    const step = steps[currentStep];
                    await applyStep(); // removes page 3 text; no title on this step
                    titleEl.style.transition = '';
                    titleEl.style.opacity    = '';
                    showMoveHint(step.movePrompt);
                    showMoveTargets(step, FLOWER_TILES[0], (cell, row, col) => revealWalkTiles(step, cell, row, col));
                }, Math.max(lastFlipMs, 400) + 150);
                return;
            }

            if (steps[currentStep].thirdMove && navDir === 1) {
                introPlaying = true;
                setNavActive(false);

                const step      = steps[currentStep];
                const powerStep = steps.find(s => s.secondMove);
                step._moved     = false;

                titleEl.style.transition = 'opacity 0.4s ease';
                titleEl.style.opacity    = '0';
                const oldText = contentEl.querySelector('.tut-text');
                if (oldText) { oldText.style.transition = 'opacity 0.4s ease'; oldText.style.opacity = '0'; }

                const collapseMs = hideShowcase(true);
                const picked     = powerStep._powers[0];
                const cards      = powerStep._powers.slice(1)
                    .map(p => tileCell(p.row, p.col)?.querySelector('.flip-card[data-powerup]'))
                    .filter(Boolean);
                setTimeout(() => {
                    cards.forEach((card, i) => {
                        const inner = card.querySelector('.flip-card-inner');
                        inner.style.animation = 'none';
                        inner.style.transform = 'rotateY(180deg)';
                        void inner.offsetWidth;
                        inner.style.animation = `tile-flip-back 1.0s ease-in-out ${(i * 0.5).toFixed(2)}s both`;
                    });
                }, collapseMs);
                const lastFlipMs = collapseMs + (cards.length > 0 ? (cards.length - 1) * 500 + 1000 : 0);

                setTimeout(async () => {
                    cards.forEach(unflipCard);
                    await applyStep(); // no title on this step
                    titleEl.style.transition = '';
                    titleEl.style.opacity    = '';
                    // "make your next move" comes in with the blinking targets, as on pages 4–5.
                    // Only monster cells — every power-up slot borders one
                    showMoveHint(step.movePrompt);
                    showMoveTargets(step, picked, cell => triggerDeath(step, cell),
                        steps.find(s => s.flipBackFlowers).monsterFlips);
                }, lastFlipMs + 150);
                return;
            }

            if (steps[currentStep].secondMove && navDir === 1) {
                // Back to creme; every walk tile but the picked one flips face-down;
                // then prompt a move from the picked tile
                introPlaying = true;
                setNavActive(false);

                const step     = steps[currentStep];
                const moveStep = steps.find(s => s.nextMove);
                step._moved    = false;

                headerEl.querySelector('.tut-title-text')?.style.setProperty('opacity', '0');
                const oldText = contentEl.querySelector('.tut-prompt');
                if (oldText) oldText.style.opacity = '0';
                setTutBg('');
                walkBgOn = false;

                const { row: pr, col: pc } = moveStep._picked;
                const picked   = tileCell(pr, pc);
                const cards    = moveStep.walkTiles
                    .map(({ row, col }) => tileCell(row, col))
                    .filter(c => c && c !== picked)
                    .map(c => c.querySelector('.flip-card[data-walkthrough]'))
                    .filter(Boolean);
                cards.forEach((card, i) => {
                    const inner = card.querySelector('.flip-card-inner');
                    inner.style.animation = 'none';
                    inner.style.transform = 'rotateY(180deg)';
                    void inner.offsetWidth;
                    inner.style.animation = `tile-flip-back 1.0s ease-in-out ${(i * 0.5).toFixed(2)}s both`;
                });
                const lastFlipMs = cards.length > 0 ? (cards.length - 1) * 500 + 1000 : 0;

                setTimeout(async () => {
                    cards.forEach(unflipCard);
                    await applyStep(); // no title on this step
                    // "make your next move" comes in with the blinking targets, as on page 4
                    showMoveHint(step.movePrompt);
                    showMoveTargets(step, { row: pr, col: pc },
                        (cell, row, col) => revealPowerUps(step, cell, row, col));
                }, Math.max(lastFlipMs, 400) + 150);
                return;
            }

            if (steps[currentStep].flipBackFlowers) {
                // Fade title + lines + text while flowers flip back; then shift background
                introPlaying = true;
                setNavActive(false);

                // Header (lines + title) and text all fade out together
                headerEl.style.transition = 'opacity 0.4s ease';
                headerEl.style.opacity    = '0';
                const fadeText = contentEl.querySelector('.tut-text');
                if (fadeText) {
                    fadeText.style.transition = 'opacity 0.4s ease';
                    fadeText.style.opacity    = '0';
                }

                const fadePrompt = contentEl.querySelector('.tut-prompt');
                if (fadePrompt) fadePrompt.style.opacity = '0';

                // Only cards currently face-up (flower 1, walk, power-up) flip back —
                // the player's death tile stays up
                const inners = Array.from(contentEl.querySelectorAll('.tut-tiles-wrap .flip-card-inner'))
                    .filter(inner => new DOMMatrix(getComputedStyle(inner).transform).a < 0 && !inner.closest('.flip-card[data-death]'));
                inners.forEach((inner, i) => {
                    void inner.offsetWidth;
                    inner.style.animation = `tile-flip-back 1.0s ease-in-out ${(i * 0.5).toFixed(2)}s both`;
                });

                const lastFlipMs = inners.length > 0 ? (inners.length - 1) * 500 + 1000 : 0;
                const waitMs     = lastFlipMs + 150;

                // All 20 tiles and background change simultaneously as the last flip lands
                setTimeout(() => {
                    contentEl.querySelectorAll('.tut-tile-cell > img, .flip-card-front img').forEach(img => {
                        img.src = 'tutorial/page5-tileback.svg';
                    });
                    document.documentElement.style.transition      = 'background-color 0.6s ease';
                    document.body.style.transition                 = 'background-color 0.6s ease';
                    document.documentElement.style.backgroundColor = '#1b4042';
                    document.body.style.backgroundColor            = '#1b4042';
                    contentEl.style.setProperty('--tut-bg', '#1b4042');
                    setTimeout(() => {
                        document.documentElement.style.transition = '';
                        document.body.style.transition            = '';
                    }, 600);
                }, lastFlipMs);

                setTimeout(async () => {
                    headerEl.style.transition = '';
                    await applyStep(); // sets lines/title src, adds text at opacity 0
                    const bgSettleMs = (lastFlipMs + 600) - waitMs;
                    setTimeout(() => {
                        // Fade in lines + title
                        headerEl.style.transition = 'opacity 0.4s ease';
                        void headerEl.offsetWidth;
                        headerEl.style.opacity = '1';
                        setTimeout(() => {
                            headerEl.style.transition = '';
                            headerEl.style.opacity    = '';
                        }, 400);

                        // Text fades in after header
                        const newText = contentEl.querySelector('.tut-text');
                        if (newText) {
                            setTimeout(() => { newText.style.opacity = ''; }, 500);
                        }

                        // Monster tiles flip after text appears
                        const step = steps[currentStep];
                        if (step.monsterFlips && step.monster) {
                            const tileRows = contentEl.querySelectorAll('.tut-tile-row-html');
                            step.monsterFlips.forEach(({ row, col }, i) => {
                                const cell = tileRows[row]?.querySelectorAll('.tut-tile-cell')[col];
                                if (!cell) return;
                                if (cell.querySelector('.flip-card[data-death]')) return; // player's death tile is already up
                                let inner = cell.querySelector('.flip-card-inner');
                                if (!inner) {
                                    // Plain cell — build a flip card in place
                                    cell.querySelector('img')?.remove();
                                    const card = document.createElement('div');
                                    card.className = 'flip-card';
                                    card.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#1b4042';
                                    inner = document.createElement('div');
                                    inner.className = 'flip-card-inner';
                                    const front = document.createElement('div');
                                    front.className = 'flip-card-front';
                                    const fi = document.createElement('img');
                                    fi.src = 'tutorial/page5-tileback.svg'; fi.alt = '';
                                    front.appendChild(fi);
                                    const back = document.createElement('div');
                                    back.className = 'flip-card-back';
                                    back.style.backgroundColor = '#1b4042';
                                    const bi = document.createElement('img');
                                    bi.src = step.monster; bi.alt = '';
                                    back.appendChild(bi);
                                    inner.style.animationDelay = `${(0.9 + i * 0.5).toFixed(2)}s`;
                                    inner.appendChild(front);
                                    inner.appendChild(back);
                                    card.appendChild(inner);
                                    cell.appendChild(card);
                                } else {
                                    // Existing flip card — reset then re-animate
                                    const backImg = inner.querySelector('.flip-card-back img');
                                    if (backImg) backImg.src = step.monster;
                                    inner.style.animation = 'none';
                                    inner.style.transform  = 'rotateY(0deg)';
                                    void inner.offsetWidth;
                                    inner.style.animation = `tile-flip 1.0s ease-in-out ${(0.9 + i * 0.5).toFixed(2)}s both`;
                                }
                            });
                            const lastMonsterMs = 900 + (step.monsterFlips.length - 1) * 500 + 1000 + 150;
                            setTimeout(() => {
                                // Collect the flip-card element for each monster tile
                                const monsterCards = [...new Set(step.monsterFlips.map(({ row, col }) =>
                                    tileRows[row]?.querySelectorAll('.tut-tile-cell')[col]?.querySelector('.flip-card')
                                ).filter(Boolean)
                                    .concat(Array.from(contentEl.querySelectorAll('.flip-card[data-death]'))))];
                                // Open up overflow on clipping ancestors so corners aren't cut off
                                const tilesWrap = contentEl.querySelector('.tut-tiles-wrap');
                                const illusWrap = contentEl.querySelector('.tut-illustration-wrap');
                                contentEl.style.overflow  = 'visible';
                                if (tilesWrap) tilesWrap.style.overflow = 'visible';
                                if (illusWrap) illusWrap.style.overflow = 'visible';
                                // Scale up 50% over 1 s
                                monsterCards.forEach(card => {
                                    card.style.transition           = 'transform 1s ease';
                                    card.parentElement.style.zIndex = '10';
                                    card.style.transform            = 'scale(1.5)';
                                });
                                // Hold 1 s, then shrink back over 1 s
                                setTimeout(() => {
                                    monsterCards.forEach(card => { card.style.transform = 'scale(1)'; });
                                    setTimeout(() => {
                                        monsterCards.forEach(card => {
                                            card.style.transition           = '';
                                            card.parentElement.style.zIndex = '';
                                        });
                                        contentEl.style.overflow  = '';
                                        if (tilesWrap) tilesWrap.style.overflow = '';
                                        if (illusWrap) illusWrap.style.overflow = '';
                                        introPlaying = false;
                                        setNavActive(true);
                                    }, 1000);
                                }, 2000); // 1 s grow + 1 s hold
                            }, lastMonsterMs);
                        } else {
                            setTimeout(() => {
                                introPlaying = false;
                                setNavActive(true);
                            }, 800);
                        }
                    }, bgSettleMs);
                }, waitMs);
                return;
            }

            if (steps[currentStep].fromMonsterFlips) {
                // Monsters flip back, tiles clear, background resets, lines.svg fades in
                introPlaying = true;
                setNavActive(false);

                const prevStep = steps[currentStep - 1];
                const tileRows = contentEl.querySelectorAll('.tut-tile-row-html');

                // Fade out title and text
                headerEl.style.transition = 'opacity 0.4s ease';
                headerEl.style.opacity    = '0';
                const fadeText = contentEl.querySelector('.tut-text');
                if (fadeText) {
                    fadeText.style.transition = 'opacity 0.4s ease';
                    fadeText.style.opacity    = '0';
                }

                // Flip each monster tile back with same stagger as the original flip
                const lastFlipMs = prevStep?.monsterFlips?.length > 0
                    ? (prevStep.monsterFlips.length - 1) * 500 + 1000 : 0;
                contentEl.querySelectorAll('.flip-card[data-death] .flip-card-inner').forEach(inner => {
                    inner.style.animation = 'tile-flip-back 1.0s ease-in-out both';
                });
                if (prevStep?.monsterFlips) {
                    prevStep.monsterFlips.forEach(({ row, col }, i) => {
                        const cell  = tileRows[row]?.querySelectorAll('.tut-tile-cell')[col];
                        const inner = cell?.querySelector('.flip-card-inner');
                        if (!inner) return;
                        void inner.offsetWidth;
                        inner.style.animation = `tile-flip-back 1.0s ease-in-out ${(i * 0.5).toFixed(2)}s both`;
                    });
                }

                // When last flip lands: restore flower backs on all cells + fade background to cream
                setTimeout(() => {
                    const flowerBackSrc = steps.find(s => s.flowerBack)?.flowerBack;
                    tileRows.forEach(rowEl => {
                        rowEl.querySelectorAll('.tut-tile-cell').forEach(cell => {
                            cell.innerHTML = '';
                            if (flowerBackSrc) {
                                const img = document.createElement('img');
                                img.src = flowerBackSrc;
                                img.alt = '';
                                img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
                                cell.appendChild(img);
                            }
                        });
                    });
                    document.documentElement.style.transition      = 'background-color 0.6s ease';
                    document.body.style.transition                 = 'background-color 0.6s ease';
                    document.documentElement.style.backgroundColor = '';
                    document.body.style.backgroundColor            = '';
                    contentEl.style.removeProperty('--tut-bg');
                    setTimeout(() => {
                        document.documentElement.style.transition = '';
                        document.body.style.transition            = '';
                    }, 600);
                }, lastFlipMs);

                // After background settles, apply step and fade lines.svg header in
                setTimeout(async () => {
                    headerEl.style.transition = '';
                    await applyStep();
                    headerEl.style.transition = 'opacity 0.4s ease';
                    void headerEl.offsetWidth;
                    headerEl.style.opacity    = '1';
                    setTimeout(() => {
                        headerEl.style.transition = '';
                        headerEl.style.opacity    = '';
                        // Description fades in once the header (title) is fully in
                        const newText = contentEl.querySelector('.tut-text, .tut-prompt.tut-body');
                        if (newText) {
                            newText.style.transition = 'opacity 0.4s ease';
                            setTimeout(() => { newText.style.opacity = ''; }, 150);
                        }
                        if (steps[currentStep].finalReveal) {
                            finalReveal(steps[currentStep]);
                        } else {
                            setTimeout(() => {
                                introPlaying = false;
                                setNavActive(true);
                            }, 500);
                        }
                    }, 400);
                }, lastFlipMs + 750); // 150ms buffer after last flip + 600ms bg transition
                return;
            }

            if (steps[currentStep].keepTiles) {
                // Tiles persist — fade only header + text (page 3 crossfades page 2's board
                // itself). Going back resets the board in place, so fade it all out instead
                const fadeAll = navDir === -1;
                headerEl.style.transition = 'opacity 0.4s ease';
                headerEl.style.opacity    = '0';
                if (fadeAll) contentEl.style.opacity = '0';
                const fadeText = contentEl.querySelector('.tut-text');
                if (fadeText) { fadeText.style.transition = 'opacity 0.4s ease'; fadeText.style.opacity = '0'; }
                setTimeout(async () => {
                    await applyStep();
                    headerEl.style.opacity = '';
                    if (fadeAll) contentEl.style.opacity = '';
                    setTimeout(() => { headerEl.style.transition = ''; }, 400);
                    // Description (text image or walk text) follows once the title is in
                    const newText = contentEl.querySelector('.tut-text, .tut-prompt.tut-body');
                    if (newText) {
                        newText.style.transition = 'none';
                        newText.style.opacity    = '0';
                        void newText.offsetWidth;
                        newText.style.transition = 'opacity 0.4s ease';
                        setTimeout(() => { newText.style.opacity = ''; }, TEXT_AFTER_TITLE_MS);
                    }
                    if (!introPlaying) setNavActive(true);
                }, 400);
            } else {
                // Standard transition: fade header and full content together
                headerEl.style.opacity  = '0';
                contentEl.style.opacity = '0';
                setTimeout(async () => {
                    await applyStep();
                    headerEl.style.opacity = '';
                    setTimeout(() => { contentEl.style.opacity = ''; if (!introPlaying) setNavActive(true); }, 250);
                }, 280);
            }
        }

        // ── Debug: jump-to-page buttons ─────────────────────────────────────
        // Shown on localhost or with ?debug in the URL. Each page's animation builds
        // on the previous page's DOM, so a button reloads for a clean slate, then
        // fast-forwards through the earlier pages (clicking page 2's reveal tile
        // along the way) and plays the chosen page's own entrance at normal speed.
        const DEBUG_KEY = 'tut-debug-jump';
        const debugOn   = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ||
                       new URLSearchParams(location.search).has('debug');

        function buildDebugBar() {
            const bar = document.createElement('div');
            bar.style.cssText = 'position:fixed;top:8px;left:8px;z-index:3000;display:flex;gap:4px;padding:4px;' +
                                'background:rgba(7,27,30,0.85);border-radius:6px;font:12px/1 "Space Mono",monospace;';
            const buttons = steps.map((_, i) => {
                const btn = document.createElement('button');
                btn.textContent   = i + 1;
                btn.title         = `Go to tutorial page ${i + 1}`;
                btn.style.cssText = 'width:26px;height:26px;border:0;border-radius:4px;color:#071b1e;font:inherit;cursor:pointer;';
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    try { sessionStorage.setItem(DEBUG_KEY, String(i)); } catch (err) {}
                    location.reload();
                });
                bar.appendChild(btn);
                return btn;
            });
            // Highlight the page currently showing
            setInterval(() => {
                buttons.forEach((btn, i) => { btn.style.background = i === currentStep ? '#f7b52c' : '#f7e9d5'; });
            }, 250);
            document.body.appendChild(bar);
        }

        function fastForwardTo(target) {
            const SPEED          = 20;
            const realSetTimeout = window.setTimeout;
            let ffOn           = true;
            window.setTimeout = (fn, ms, ...args) => realSetTimeout(fn, (ms || 0) / SPEED, ...args);
            (function speedUp() {
                if (!ffOn) return;
                document.getAnimations().forEach(a => { a.playbackRate = SPEED; });
                requestAnimationFrame(speedUp);
            })();

            // A page is done once its animations have re-shown "click to continue"
            const navIdle = () => !introPlaying && !!document.getElementById('tut-tap-hint')?.classList.contains('visible');
            const advance = () => { setNavActive(false); navDir = 1; currentStep++; render(true); };

            const normalSpeed = () => {
                ffOn = false;
                window.setTimeout = realSetTimeout;
                document.getAnimations().forEach(a => { a.playbackRate = 1; });
            };

            (function drive() {
                const revealCard = document.querySelector('.tut-tile-reveal .flip-card');
                const moveTarget = document.querySelector('.tut-move-target');
                // Page 2's flip and page 6's move run straight into the next page, so when
                // that page is the target, drop to normal speed before the click
                const leadsToTarget = currentStep === target - 1;
                if (revealCard && !revealCard.dataset.flipped) {
                    if (leadsToTarget) { normalSpeed(); revealCard.click(); return; }
                    revealCard.click(); // page 2 waits for its tile to be flipped
                } else if (moveTarget) {
                    if (leadsToTarget && steps[currentStep].thirdMove) { normalSpeed(); moveTarget.click(); return; }
                    moveTarget.click(); // next-move step waits for a move
                } else if (navIdle()) {
                    if (leadsToTarget) {
                        normalSpeed();
                        advance(); // the chosen page plays at normal speed
                        return;
                    }
                    advance();
                }
                realSetTimeout(drive, 50);
            })();
        }

        let debugJump = null;
        try {
            debugJump = sessionStorage.getItem(DEBUG_KEY);
            sessionStorage.removeItem(DEBUG_KEY);
        } catch (err) {}
        if (debugOn) buildDebugBar();
        if (debugJump !== null && +debugJump > 0) fastForwardTo(+debugJump);

        preloadAssets();
        render(false);
    </script>
</body>
</html>
